<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abogados Mudos — Sala del tribunal</title>
<style>
:root{--bg:#14291f;--wood:#2a1a12;--paper:#e6e9e4;--ink:#14211c;--a:#2457a6;--b:#c1272d;--brass:#c9a227}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(circle at 50% 30%,#1d3a2d,var(--bg));color:var(--paper);font:20px/1.3 system-ui,sans-serif;height:100vh;display:grid;grid-template-rows:auto 1fr;overflow:hidden}
h1,h2,.slab{font-family:Rockwell,"Roboto Slab",Georgia,serif;font-weight:700}
#bars{display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:center;padding:14px 22px;background:var(--wood);border-bottom:4px solid var(--brass)}
.bar{background:#0006;border-radius:6px;height:34px;position:relative;overflow:hidden;border:2px solid #0008}
.bar i{display:block;height:100%;width:0;transition:width 1.2s cubic-bezier(.3,1.4,.5,1)}
#bA i{background:var(--a)}#bB i{background:var(--b)}
.bar span{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;text-shadow:0 1px 3px #000}
#mid{text-align:center}#mid b{font-size:30px}
main{display:grid;grid-template-columns:230px 1fr 230px;gap:18px;padding:18px 22px;min-height:0}
.team{display:flex;flex-direction:column;gap:10px}.team h2{font-size:22px}
.lawyer{background:var(--paper);color:var(--ink);border-radius:6px;padding:10px 12px;border-left:10px solid;display:flex;gap:10px;align-items:center;transition:transform .2s}
#tA .lawyer{border-color:var(--a)}#tB .lawyer{border-color:var(--b)}
.lawyer small{display:block;opacity:.65;font-size:14px}.lawyer em{margin-left:auto;font-style:normal}
.lawyer.done{transform:translateX(6px);outline:3px solid var(--brass)}
#stage{display:grid;grid-template-rows:auto 1fr;gap:14px;min-height:0;position:relative}
#judge{text-align:center;font-size:84px;line-height:1}#judge.hit{animation:hit .5s}
@keyframes hit{30%{transform:translateY(24px) rotate(-14deg)}}
.panel{background:var(--paper);color:var(--ink);border-radius:8px;padding:26px 30px;display:flex;flex-direction:column;gap:18px;min-height:0}
.panel h2{font-size:34px;line-height:1.15}
#tbar{height:12px;background:#0002;border-radius:6px;overflow:hidden}#tbar i{display:block;height:100%;background:var(--brass);width:100%}
#opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{padding:16px 18px;border-radius:6px;color:#fff;font-weight:700;font-size:26px;display:flex;gap:12px;align-items:center}
.opt:nth-child(1){background:#c1272d}.opt:nth-child(2){background:#2457a6}.opt:nth-child(3){background:#9a6b00}.opt:nth-child(4){background:#2e7d4f}
.opt.no{opacity:.25}.opt.yes{outline:6px solid var(--ink)}
#res{font-size:26px;font-weight:700;text-align:center;min-height:36px}
#code{font-size:110px;letter-spacing:.12em;color:var(--brass)}
#toast{position:absolute;left:50%;top:90px;transform:translateX(-50%);background:var(--brass);color:var(--ink);padding:10px 24px;border-radius:6px;font-size:28px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.on{opacity:1}
.hide{display:none!important}
button{font:inherit;padding:14px 30px;border:0;border-radius:6px;background:var(--b);color:#fff;font-weight:700;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="bars">
 <div class="bar" id="bA"><i></i><span>Equipo Azul: 0 años</span></div>
 <div id="mid"><b class="slab">Condenómetro</b><div id="rd"></div></div>
 <div class="bar" id="bB"><i></i><span>Equipo Rojo: 0 años</span></div>
</div>
<main>
 <div class="team" id="tA"></div>
 <div id="stage">
  <div id="judge">⚖️</div>
  <div id="toast"></div>
  <div class="panel" id="lobby">
   <h2>Entra desde tu celular a <u id="url"></u></h2>
   <div>Código de sala</div><div id="code" class="slab">····</div>
   <button id="start">Abrir la audiencia</button>
  </div>
  <div class="panel hide" id="q"><div id="cat"></div><div id="tbar"><i></i></div><h2 id="qt"></h2><div id="opts"></div><div id="res"></div></div>
  <div class="panel hide" id="end"><h2 id="win"></h2><div id="sub"></div></div>
 </div>
 <div class="team" id="tB"></div>
</main>
<script src="/socket.io/socket.io.js"></script>
<script>
const s=io(),$=id=>document.getElementById(id),RN={principal:['⚖️','Abogado Principal'],investigador:['🔍','Investigador'],perito:['🧪','Perito'],procurador:['📎','Procurador'],escribano:['✒️','Escribano']};
const FX={protesto:'¡Protesto, Su Señoría!',pista:'Pista Anónima',dictamen:'Dictamen Irrefutable',apelacion:'Recurso de Apelación',tinta:'¡Tinta Derramada!'};
let S=null,done=new Set(),started=false;
$('url').textContent=location.host;
s.emit('create');
s.on('code',c=>$('code').textContent=c);
s.on('state',st=>{S=st;render()});
$('start').onclick=()=>s.emit('start');
function show(id){['lobby','q','end'].forEach(x=>$(x).classList.toggle('hide',x!==id))}
function render(){
 ['A','B'].forEach(t=>{
  $('t'+t).innerHTML='<h2 class="slab">'+(t=='A'?'Equipo Azul':'Equipo Rojo')+'</h2>'+S.players.filter(p=>p.team==t).map(p=>
   `<div class="lawyer ${done.has(p.id)?'done':''}"><span style="font-size:30px">${RN[p.role][0]}</span><div>${p.name}<small>${RN[p.role][1]}</small></div><em>${p.streak>1?'🔥'+p.streak:''}</em></div>`).join('')});
 ['A','B'].forEach(t=>{const y=S.years[t];$('b'+t).firstElementChild.style.width=y+'%';$('b'+t).lastElementChild.textContent=(t=='A'?'Equipo Azul: ':'Equipo Rojo: ')+y+' años'});
}
s.on('question',d=>{
 started=true;done.clear();show('q');$('res').textContent='';
 $('rd').textContent='Ronda '+d.round+' de '+d.rounds+' · Fase '+['Alegatos','Pruebas','Veredicto'][d.B-1];
 $('cat').textContent='Categoría: '+d.cat;$('qt').textContent=d.text;
 $('opts').innerHTML=d.opts.map((o,i)=>`<div class="opt">${'▲◆●■'[i]} ${o}</div>`).join('');
 const b=$('tbar').firstElementChild;b.style.transition='none';b.style.width='100%';b.offsetWidth;b.style.transition='width '+d.time+'s linear';b.style.width='0';
 $('judge').textContent='🧐';
});
s.on('answered',id=>{done.add(id);render()});
s.on('result',d=>{
 [...$('opts').children].forEach((el,i)=>el.classList.add(i==d.correct?'yes':'no'));
 $('res').textContent='Condena: Azul +'+d.dmg.A+' · Rojo +'+d.dmg.B+' años';
 $('judge').textContent='🔨';$('judge').classList.remove('hit');$('judge').offsetWidth;$('judge').classList.add('hit');
});
s.on('fx',f=>{const t=$('toast');t.textContent=FX[f.k]+' — '+f.name;t.style.background=f.team=='A'?'#7fa8ec':'#ee8b8f';t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)});
s.on('end',e=>{show('end');$('judge').textContent=e.winner=='EMPATE'?'🤷':'🏛️';
 $('win').textContent=e.winner=='EMPATE'?'Empate en el tribunal':(e.perpetua?'Cadena perpetua para el equipo '+(e.winner=='A'?'Rojo':'Azul')+'. ':'')+'Gana el equipo '+(e.winner=='A'?'Azul':'Rojo');
 $('sub').textContent='Condenas finales — Azul: '+e.years.A+' años · Rojo: '+e.years.B+' años'});
</script></body></html>
