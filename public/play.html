<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Abogados Mudos</title>
<style>
:root{--bg:#14291f;--wood:#2a1a12;--paper:#e6e9e4;--ink:#14211c;--brass:#c9a227}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--paper);font:18px/1.3 system-ui,sans-serif;min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
h1,h2,.slab{font-family:Rockwell,"Roboto Slab",Georgia,serif}
.v{flex:1;display:none;flex-direction:column;gap:14px;padding:16px}.v.on{display:flex}
input,button{font:inherit;padding:14px;border-radius:6px;border:0;width:100%}
input{background:var(--paper);color:var(--ink);text-transform:uppercase}#n{text-transform:none}
button{background:var(--brass);color:var(--ink);font-weight:700}
#hud{background:var(--wood);padding:10px 16px;display:flex;justify-content:space-between;font-weight:700;border-bottom:3px solid var(--brass)}
#opts{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px}
#opts button{color:#fff;font-size:20px;min-height:110px;display:flex;flex-direction:column;justify-content:center;gap:6px}
#opts button:nth-child(1){background:#c1272d}#opts button:nth-child(2){background:#2457a6}#opts button:nth-child(3){background:#9a6b00}#opts button:nth-child(4){background:#2e7d4f}
#opts button b{font-size:34px}
#opts button.sel{outline:5px solid #fff}#opts button.off{opacity:.3}
#ob:disabled{opacity:.4}
.big{font-size:30px;text-align:center;margin-top:20px}
#ink{position:fixed;inset:0;background:radial-gradient(circle at 30% 40%,#000 0 30%,#000d 60%);display:none;z-index:9;place-items:center;font-size:32px}
#ink.on{display:grid}
</style></head><body>
<div id="hud"><span id="who">Abogados Mudos</span><span id="stat"></span></div>
<div class="v on" id="join">
 <h1>Sube al estrado</h1>
 <input id="c" maxlength="4" placeholder="Código de sala" autocomplete="off">
 <input id="n" maxlength="14" placeholder="Tu nombre">
 <button id="jb">Entrar al tribunal</button>
</div>
<div class="v" id="wait"><h2 class="big" id="wt">Esperando al Juez…</h2><p id="role" style="text-align:center"></p></div>
<div class="v" id="q"><div id="opts"></div><button id="ob"></button><div id="mini" style="text-align:center"></div></div>
<div class="v" id="res"><h2 class="big" id="rt"></h2><p id="rs" style="text-align:center"></p></div>
<div id="ink"><span>Tinta en tu pantalla…</span></div>
<script src="/socket.io/socket.io.js"></script>
<script>
const s=io(),$=id=>document.getElementById(id);
const RN={principal:['⚖️','Abogado Principal'],investigador:['🔍','Investigador'],perito:['🧪','Perito'],procurador:['📎','Procurador'],escribano:['✒️','Escribano']};
const OB={principal:['protesto','¡Protesto, Su Señoría!',3],investigador:['pista','Pista Anónima',1],perito:['dictamen','Dictamen Irrefutable',2],procurador:['apelacion','Recurso de Apelación',3],escribano:['tinta','Tinta Derramada',2]};
let me=null,round=0,open=false;
const show=id=>['join','wait','q','res'].forEach(x=>$(x).classList.toggle('on',x==id));
$('c').value=new URLSearchParams(location.search).get('c')||'';
$('jb').onclick=()=>s.emit('join',{code:$('c').value.trim().toUpperCase(),name:$('n').value.trim()||'Anónimo'});
s.on('err',m=>alert(m));
s.on('me',p=>{const first=!me;me=p;hud();if(first){show('wait');$('role').textContent='Equipo '+(p.team=='A'?'Azul':'Rojo')+' · '+RN[p.role][1]}objBtn()});
function hud(){$('who').textContent=RN[me.role][0]+' '+me.name;$('stat').textContent='Evidencia '+me.ev+'/5 · 🔥'+me.streak}
function objBtn(){const o=OB[me.role],b=$('ob');b.textContent=o[1]+' ('+o[2]+' Evidencia)';
 b.disabled=!open||round<3||me.ev<o[2]||round<me.cd;b.onclick=()=>s.emit('obj',o[0])}
s.on('question',d=>{round=d.round;open=true;show('q');$('mini').textContent=d.text;
 $('opts').innerHTML=d.opts.map((o,i)=>`<button data-i="${i}"><b>${'▲◆●■'[i]}</b>${o}</button>`).join('');
 [...$('opts').children].forEach(b=>b.onclick=()=>{s.emit('answer',+b.dataset.i);b.classList.add('sel')});
 objBtn()});
s.on('locked',()=>{[...$('opts').children].forEach(b=>{b.disabled=true;if(!b.classList.contains('sel'))b.classList.add('off')});$('mini').textContent='Respuesta sellada. Esperando el veredicto…'});
s.on('hide',i=>{const b=$('opts').children[i];if(b&&!b.classList.contains('sel'))b.classList.add('off'),b.disabled=true});
s.on('ink',ms=>{$('ink').classList.add('on');setTimeout(()=>$('ink').classList.remove('on'),ms)});
s.on('result',d=>{open=false;me=d.me;hud();show('res');
 $('rt').textContent=d.ok?'🟢 ¡Inocente!':'🔴 Culpable';
 $('rs').textContent=d.ok?'Tu acierto suma '+d.g+' años al rival.':'Fallaste: pierdes la racha.'});
s.on('end',e=>{show('res');const mine=me.team;$('rt').textContent=e.winner=='EMPATE'?'Empate':(e.winner==mine?'🏆 Victoria':'😔 Condena');
 $('rs').textContent='Azul '+e.years.A+' años · Rojo '+e.years.B+' años'});
</script></body></html>
